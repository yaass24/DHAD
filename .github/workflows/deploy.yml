# ضاد | DHAD — build with Vite and publish dist/ to GitHub Pages.
# Pages must be set to "GitHub Actions" in  Settings → Pages → Build and deployment → Source.
name: Deploy DHAD to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; never cancel a running one half-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # npm ci when a lockfile exists, npm install otherwise
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - name: Check the build output
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          ls -R dist | head -50

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
