<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ضاد | DHAD</title>
    <!--
      GitHub Pages serves this file for any unknown path under /DHAD/.
      The game uses hash routes (#/kids/...), so a path such as /DHAD/kids
      is turned into /DHAD/#/kids and the app opens on the right page.
    -->
    <script>
      (function () {
        var base = location.pathname.indexOf('/DHAD/') === 0 ? '/DHAD/' : '/';
        var rest = location.pathname.slice(base.length).replace(/^\/+/, '').replace(/index\.html$/, '');
        var hash = location.hash.replace(/^#\/?/, '');
        location.replace(base + '#/' + (hash || rest) + location.search);
      })();
    </script>
  </head>
  <body style="background: #faf8f1; font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px">
    <p>جارٍ فتح ضاد… <a href="/DHAD/">اضغط هنا إن لم تُفتح الصفحة</a></p>
  </body>
</html>
